server.port=8080
spring.application.name=enterprise-railway-ai

spring.flyway.enabled=true

# Base URL for your local Ollama instance
spring.ai.ollama.base-url=http://localhost:11434
# The specific model you downloaded via the CLI
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.7
# Optional: Automatically pull the model if it's missing on your machine
spring.ai.ollama.init.pull-model-strategy=when_missing
# Set the active embedding model
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Database connection
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/mydb
spring.datasource.username=postgres
spring.datasource.password=postgres

# PGVector Store Configuration
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# PDF upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# MCP server using HTTP transport
spring.mcp.server.name=railway-mcp-server
spring.mcp.server.version=1.0.0
spring.mcp.server.type=SYNC
spring.mcp.server.protocol=STREAMABLE
spring.mcp.server.instructions=Read-only railway lookup and policy search tools. Notification dispatch is controlled by the workflow REST API.
spring.ai.mcp.server.annotation-scanner.enabled=true


management.endpoints.web.exposure.include=health,info,metrics

logging.level.root=INFO
logging.level.com.pravin.railway=INFO
